[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-desktop"
version = "0.1.0"
description = "Cross-platform PaddleOCR desktop application"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyQt6>=6.7,<6.10",
  "Pillow>=10.4,<12",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "paddleocr>=3.5,<4",
]

[project.scripts]
paddleocr-desktop = "paddleocr_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
